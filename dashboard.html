<div id="deliveryManagerModal" class="delivery-modal" hidden>
  <div class="delivery-modal-backdrop" data-delivery-close></div>
  <section class="delivery-modal-card" role="dialog" aria-modal="true" aria-labelledby="deliveryModalTitle">
    <div class="delivery-modal-head">
      <div>
        <p class="eyebrow">GESTÃO DE ENTREGA</p>
        <h2 id="deliveryModalTitle">Pedido</h2>
        <p id="deliveryModalCustomer"></p>
      </div>
      <button type="button" class="delivery-close" data-delivery-close aria-label="Fechar">×</button>
    </div>
    <div class="delivery-current">
      <span>Status atual</span>
      <strong id="deliveryCurrentStatus">—</strong>
    </div>
    <form id="deliveryManagerForm" class="delivery-form">
      <label class="delivery-field">
        <span>Novo status</span>
        <select id="deliveryStatus" required>
          <option value="preparing">Em preparação</option>
          <option value="posted">Postado / coletado</option>
          <option value="in_transit">Em trânsito</option>
          <option value="out_for_delivery">Saiu para entrega</option>
          <option value="delivered">Entregue</option>
          <option value="delivery_failed">Tentativa de entrega</option>
          <option value="returned">Devolvido</option>
          <option value="canceled">Cancelado</option>
        </select>
        <small id="deliveryStatusHelp"></small>
      </label>
      <div class="delivery-form-grid">
        <label class="delivery-field"><span>Transportadora / entregador</span><input id="deliveryCarrier" placeholder="Ex.: 99Entrega, Correios, entrega própria"></label>
        <label class="delivery-field"><span>Código de rastreamento</span><input id="deliveryTrackingCode" placeholder="Opcional"></label>
        <label class="delivery-field span-2"><span>Link de rastreamento</span><input id="deliveryTrackingUrl" type="url" placeholder="https://..."></label>
        <label class="delivery-field"><span>Previsão de entrega</span><input id="deliveryEstimate" type="date"></label>
        <label class="delivery-field"><span>Local da atualização</span><input id="deliveryLocation" placeholder="Ex.: Marília/SP"></label>
        <label class="delivery-field span-2"><span>Mensagem para o cliente</span><textarea id="deliveryMessage" rows="3" placeholder="Ex.: Pedido coletado e a caminho do endereço informado."></textarea></label>
      </div>
      <div class="delivery-preview">
        <span>O cliente verá</span>
        <strong id="deliveryPreviewLabel">—</strong>
        <p id="deliveryPreviewText"></p>
      </div>
      <div id="deliveryFormError" class="delivery-form-error" aria-live="polite"></div>
      <div class="delivery-modal-actions">
        <button type="button" class="button secondary" data-delivery-close>Cancelar</button>
        <button type="submit" class="catalog-primary" id="deliverySave">Salvar atualização</button>
      </div>
    </form>
  </section>
</div>
