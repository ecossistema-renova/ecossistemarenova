<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Redefinir senha · OYAG Ecosystem</title><link rel="stylesheet" href="./app-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.production.js?v=prod-20260918-01"></script></head><body class="auth-page"><main class="auth-card"><a class="oyag-logo" href="./"><span>O</span><b>OYAG Ecosystem</b></a><p class="env">RECUPERAÇÃO DE ACESSO</p><h1>Definir nova senha</h1><p class="muted">Escolha uma nova senha para sua conta.</p><form id="resetForm"><label>Nova senha<div class="password-field"><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"><button id="showNew" class="password-toggle" type="button">👁</button></div></label><label>Confirmar nova senha<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button type="submit">Atualizar senha</button></form><p id="msg" class="msg"></p><a class="back" href="./login.html">← Voltar ao login</a></main><script>const c=window.OYAG_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),m=document.querySelector('#msg'),p=document.querySelector('#newPassword'),q=document.querySelector('#confirmPassword');document.querySelector('#showNew').onclick=()=>{p.type=p.type==='password'?'text':'password'};document.querySelector('#resetForm').onsubmit=async e=>{e.preventDefault();if(p.value!==q.value){m.textContent='As senhas não conferem.';return}m.textContent='Atualizando…';const {error}=await s.auth.updateUser({password:p.value});if(error){m.textContent='O link pode ter expirado. Solicite uma nova recuperação.';return}m.textContent='Senha atualizada. Redirecionando…';setTimeout(()=>location.replace('./dashboard.html'),700)};</script></body></html>
