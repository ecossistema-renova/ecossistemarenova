<body style="margin:0;background:#061b2b">
<script>
(function(){
  var ua=navigator.userAgent||'';
  var isMobile=/Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(ua);
  var target=isMobile?'./mobile/':'./desktop/';
  location.replace(target+(location.search||'')+(location.hash||''));
})();
</script>
<noscript><a href="./desktop/" style="color:white">Acessar OYAG Ecosystem</a></noscript>
</body>
